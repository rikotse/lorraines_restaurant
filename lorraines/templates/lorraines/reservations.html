{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lorraine's | Book a Table</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="{% static 'style.css' %}" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container nav-container">
        <a href="{% url 'home' %}" class="logo">
          <img src="{% static 'Images/Logo.png' %}" alt="Lorraine's Logo" />
          <span class="logo-text">Lorraine's</span>
        </a>
        <ul class="nav-links">
          <li><a href="{% url 'home' %}">Home</a></li>
          <li><a href="{% url 'about' %}">About</a></li>
          <li><a href="{% url 'menu' %}">Menu</a></li>
          <li><a href="{% url 'testimonials' %}">Testimonials</a></li>
          <li><a href="{% url 'reservations' %}" class="active-page">Reservations</a></li>
          <li><a href="{% url 'ordering' %}" class="btn-highlight">Order Online</a></li>
        </ul>
        <div class="hamburger"><span></span><span></span><span></span></div>
      </div>
    </nav>

    <header class="page-header" style="background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('{% static 'Images/851879d2-8077-4f06-a396-6cf63e94f341.jpg' %}');">
        <div class="header-content reveal-text">
            <h1>Reserve Your Table</h1>
        </div>
    </header>

    <section class="reservation-section">
      <div class="container">
        <div class="reservation-grid">
            <div class="reservation-info reveal-left">
                <h2>The Perfect Setting</h2>
                <div class="divider-gold"></div>
                <p>We recommend booking at least 24 hours in advance for weekend seating.</p>
            </div>

            <div class="reservation-form-wrapper reveal-right">
                <form id="bookingForm" class="gold-form" method="POST" action="{% url 'submit_reservation' %}">
                    {% csrf_token %}
                    <h3>Make a Reservation</h3>
                    <div class="form-row">
                        <div class="input-group">
                            <label>Full Name</label>
                            <input type="text" name="name" required>
                        </div>
                        <div class="input-group">
                            <label>Phone Number</label>
                            <input type="tel" name="phone" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <label>Date</label>
                            <input type="date" name="date" required>
                        </div>
                        <div class="input-group">
                            <label>Time</label>
                            <select name="time" required>
                                <option value="18:00">18:00</option>
                                <option value="19:00">19:00</option>
                                <option value="20:00">20:00</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-group">
                         <label>Guests</label>
                         <input type="number" name="guests" min="1" max="20" required>
                    </div>
                     <div class="input-group">
                         <label>Occasion</label>
                         <input type="text" name="occasion">
                    </div>
                    <div class="input-group">
                        <label>Special Requests</label>
                        <textarea name="notes" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn-submit">Confirm Reservation</button>
                </form>
            </div>
        </div>
      </div>
    </section>

    <script src="{% static 'script.js' %}"></script>
  </body>
</html>
